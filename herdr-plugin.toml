id = "herdr-rpc"
name = "Discord Rich Presence"
version = "0.1.0"
min_herdr_version = "0.9.2"
description = "Show your focused Herdr workspace and agent on Discord"
platforms = ["windows", "macos", "linux"]

[[startup]]
command = ["node", "src/background.js", "start"]

[[events]]
on = "workspace.focused"
command = ["node", "src/focus-hook.js"]

[[events]]
on = "tab.focused"
command = ["node", "src/focus-hook.js"]

[[events]]
on = "pane.focused"
command = ["node", "src/focus-hook.js"]

[[actions]]
id = "start"
title = "Start Discord presence in background"
contexts = ["workspace"]
command = ["node", "src/background.js", "start"]

[[actions]]
id = "stop"
title = "Stop background Discord presence"
contexts = ["workspace"]
command = ["node", "src/background.js", "stop"]

[[actions]]
id = "status"
title = "Check background Discord presence"
contexts = ["workspace"]
command = ["node", "src/background.js", "status"]

[[panes]]
id = "presence"
title = "Discord Rich Presence"
placement = "tab"
command = ["node", "src/index.js"]
